\* Two jobs, two workers and two tries each: 81 states, checked in about a second.
SPECIFICATION Spec
CONSTANTS
  Jobs = {j1, j2}
  Workers = {w1, w2}
  None = None
  MaxTries = 2
INVARIANTS
  TypeOK
  OwnedWhileRunning
  DoneWasTried
  TriedUnlessQueued
\* The machine stops by design once every job is done or out of tries, so a state with no next step is not a bug here.
CHECK_DEADLOCK FALSE
