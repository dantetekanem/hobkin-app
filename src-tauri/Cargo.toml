[package]
name = "hobkin"
version = "0.0.1"
description = "A Mac client for hobkin"
edition = "2021"
publish = false

[lib]
name = "hobkin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
