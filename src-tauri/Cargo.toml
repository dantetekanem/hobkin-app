[package]
name = "hobkin"
version = "0.1.23"
description = "Your next level Harness."
authors = ["Leonardo Pereira"]
edition = "2021"
publish = false

[lib]
name = "hobkin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is Tauri's multi-webview API: the canvas's browser is a child webview of the main window (036-canvas-browser).
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
# Updates for a release build, from hobkin.dev (src/updates.rs). A development build never registers it.
tauri-plugin-updater = "2"

# The shell's own code keeps a debug build's checks, with line numbers only. Its dependencies (Tauri, wry, tao, objc2)
# are built optimized and without their debug assertions, so the daily `tauri dev` window does not check every
# Objective-C message they send. `"*"` names dependencies only (052, S19).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
debug-assertions = false
overflow-checks = false

# A panic still unwinds: one in a background thread ends that thread, not the app.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The Mac's own notification permission (037-notifications): asked and read through UNUserNotificationCenter.
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSError"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter", "UNNotificationSettings"] }
